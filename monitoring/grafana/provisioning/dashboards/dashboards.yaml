apiVersion: 1
providers:
- name: monitoring
  orgId: 1
  folder: monitoring
  type: file
  disableDeletion: false
  editable: true
  updateIntervalSeconds: 30
  options:
    path: /var/lib/grafana/dashboards/monitoring
- name: logger
  orgId: 1
  folder: logger
  type: file
  disableDeletion: false
  editable: true
  updateIntervalSeconds: 30
  options:
    path: /var/lib/grafana/dashboards/logger
