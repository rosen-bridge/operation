groups:
  - name: docker-services
    rules:
      - alert: DockerServiceStopped
        expr: |
          max by (host, container_label_com_docker_compose_project, container_label_com_docker_compose_service) (
            present_over_time(container_last_seen{
              container_label_com_docker_compose_service!="",
              name=~".*(guard|watcher|monitoring).*"
            }[1d])
          )
          unless on (host, container_label_com_docker_compose_project, container_label_com_docker_compose_service)
          max by (host, container_label_com_docker_compose_project, container_label_com_docker_compose_service) (
            present_over_time(container_last_seen{
              container_label_com_docker_compose_service!="",
              name=~".*(guard|watcher|monitoring).*"
            }[1m])
          )
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.container_label_com_docker_compose_service }} appears stopped in {{ $labels.container_label_com_docker_compose_project }} project."
          description: "No cAdvisor service metrics for more than a minute."
          silence_matchers: "alertname%3DDockerServiceStopped&matcher=container_label_com_docker_compose_service%3D{{ $labels.container_label_com_docker_compose_service }}&matcher=container_label_com_docker_compose_project%3D{{ $labels.container_label_com_docker_compose_project }}"

      - alert: DockerServiceRestartLoop
        expr: |
          changes(container_start_time_seconds{
            container_label_com_docker_compose_service!="",
            name=~".*(guard|watcher|monitoring).*"
          }[5m]) > 3
          or
          (
            count by (container_label_com_docker_compose_project, container_label_com_docker_compose_service, name) (
              present_over_time(container_start_time_seconds{
                container_label_com_docker_compose_service!="",
                name=~".*(guard|watcher|monitoring).*"
              }[5m])
            ) > 3
          )
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Restart loop detected for service {{ $labels.container_label_com_docker_compose_service }}."
          description: "Service restarted more than 3 times in 5 minutes in {{ $labels.container_label_com_docker_compose_project }} project."
          silence_matchers: "alertname%3DDockerServiceRestartLoop&matcher=container_label_com_docker_compose_service%3D{{ $labels.container_label_com_docker_compose_service }}&matcher=container_label_com_docker_compose_project%3D{{ $labels.container_label_com_docker_compose_project }}"
