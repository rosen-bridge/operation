groups:
  - name: docker-services
    rules:
      - alert: DockerServiceStopped
        expr: |
          max by (host, container_label_com_docker_compose_project, container_label_com_docker_compose_service) (
            present_over_time(container_last_seen{
              container_label_com_docker_compose_service!="",
              name=~"^/?(guard|watcher).*"
            }[1d])
          )
          unless on (host, container_label_com_docker_compose_project, container_label_com_docker_compose_service)
          max by (host, container_label_com_docker_compose_project, container_label_com_docker_compose_service) (
            present_over_time(container_last_seen{
              container_label_com_docker_compose_service!="",
              name=~"^/?(guard|watcher).*"
            }[1m])
          )
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Docker service {{ $labels.container_label_com_docker_compose_service }} appears stopped"
          description: "No cAdvisor metrics for >1m. host={{ $labels.host }} instance={{ $labels.instance }} project={{ $labels.container_label_com_docker_compose_project }} container={{ $labels.name }}"

      - alert: DockerServiceRestartLoop
        expr: |
          changes(container_start_time_seconds{
            container_label_com_docker_compose_service!="",
            name=~"^/?(guard|watcher).*"
          }[5m]) > 3
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Docker service {{ $labels.container_label_com_docker_compose_service }} restarted >3 times in 5m"
          description: "Restart loop detected. host={{ $labels.host }} instance={{ $labels.instance }} project={{ $labels.container_label_com_docker_compose_project }} container={{ $labels.name }}"
